{% extends 'Tutor/common_tu.html' %}
{% load static %}

{% for m in messages %}
<script>
    alert("{{ m }}")
</script>
{% endfor %}

{% block content %}

<!-- Hero Section -->
<section class="hero-wrap" style="background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('../static/images/bg_2.jpg') no-repeat center center/cover; height: 350px;">
    <div class="container">
        <div class="row no-gutters slider-text align-items-center justify-content-center">
            <div class="col-md-9 text-center text-white">
                <p class="breadcrumbs">
                    <span class="mr-2">
                        <a href="/tutorhome" class="text-white">Home <i class="fa fa-chevron-right"></i></a>
                    </span>
                    <span>Request Demo <i class="fa fa-chevron-right"></i></span>
                </p>
                <h1 class="mb-3">Request a Demo</h1>
            </div>
        </div>
    </div>
</section>

<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
    body {
        background-color: #f8f9fa;
    }

    .demo-container {
        max-width: 600px;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .file-upload {
        display: block;
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        text-align: center;
        font-size: 16px;
        cursor: pointer;
        color: #007bff;
        background-color: #f1f8ff;
        margin-bottom: 15px;
    }

    .file-upload:hover {
        background-color: #e7f0ff;
    }

    .btn-primary {
        width: 100%;
        font-size: 18px;
        padding: 10px;
    }
</style>

<!-- Demo Request Section -->
<div class="demo-container">
    <h3 class="mb-4 text-center">Submit Your Demo Video</h3>
    <form method="POST" enctype="multipart/form-data" id="contactForm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="video" class="form-label">Upload Video</label>
            <input type="file" name="video" id="video" class="form-control file-upload" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>

{% endblock %}
